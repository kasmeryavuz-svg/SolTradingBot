services:
  meme-trading-bot:
    build: .
    read_only: true
    init: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      TRADING_ENABLED: "false"
      LIVE_BROADCAST_ENABLED: "false"
    volumes:
      - production-data:/app/data
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4314/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  production-data:
